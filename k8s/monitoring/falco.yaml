# Falco eBPF DaemonSet — ships JSON events to stdout.
# Promtail scrapes this pod (label app=falco) → Loki stream {app="falco"}.
# Collector (src/brain/collector.py) queries: {app="falco"}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "replicationcontrollers", "services", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
- kind: ServiceAccount
  name: falco
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: monitoring
data:
  falco.yaml: |
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/rules.d

    json_output: true
    json_include_output_property: true
    log_stderr: true
    log_syslog: false
    log_level: info
    priority: notice
    buffered_outputs: false

    engine:
      kind: modern_ebpf

    stdout_output:
      enabled: true

    file_output:
      enabled: false

    syslog_output:
      enabled: false

    http_output:
      enabled: false

    plugins: []
    load_plugins: []

    watch_config_files: true
    time_format_iso_8601: true

    # K3s containerd socket
    container_engines:
      cri:
        enabled: true
        sockets:
          - /run/k3s/containerd/containerd.sock
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-rules-local
  namespace: monitoring
data:
  # Sourced from config/falco/falco_rules.local.yaml (MITRE-mapped Aegis rules).
  falco_rules.local.yaml: |
    # Aegis Custom Falco Security Rules (MITRE ATT&CK Mapped)

    - rule: Aegis Shell Spawned in Container
      desc: Detect when an interactive shell (sh, bash) is executed inside a container
      condition: >
        spawned_process and container and
        proc.name in (bash, sh, zsh, dash, ash, ksh, csh) and
        not proc.cmdline contains "docker-entrypoint"
      output: >
        [SECURITY_ALERT] Falco eBPF: Notice Shell spawned in container (user=%user.name pod=%k8s.pod.name container=%container.name cmd=%proc.cmdline pid=%proc.pid) MITRE:T1059
      priority: WARNING
      tags: [mitre_execution, T1059, aegis_security]

    - rule: Aegis Sensitive File Read
      desc: Detect attempts to open or read sensitive Linux system files (/etc/shadow, /etc/passwd)
      condition: >
        open_read and container and
        (fd.name startswith "/etc/shadow" or fd.name startswith "/etc/passwd")
      output: >
        [SECURITY_ALERT] Falco eBPF: Warning Sensitive file read (file=%fd.name pod=%k8s.pod.name container=%container.name user=%user.name cmd=%proc.cmdline) MITRE:T1552
      priority: ERROR
      tags: [mitre_credential_access, T1552, aegis_security]

    - rule: Aegis Network Discovery Tool Spawned
      desc: Detect execution of network scanning or exfiltration tools (curl, nmap, netcat, socat)
      condition: >
        spawned_process and container and
        proc.name in (nc, nmap, netcat, socat)
      output: >
        [SECURITY_ALERT] Falco eBPF: Notice Network discovery tool spawned (user=%user.name pod=%k8s.pod.name container=%container.name cmd=%proc.cmdline) MITRE:T1046
      priority: NOTICE
      tags: [mitre_discovery, T1046, aegis_security]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: monitoring
  labels:
    app: falco
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
    spec:
      serviceAccountName: falco
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: falco
        # falco-no-driver: modern_ebpf only (no kernel module). Multi-arch includes arm64.
        image: docker.io/falcosecurity/falco-no-driver:0.39.2
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        args:
          - /usr/bin/falco
          - -pk
          - -o
          - json_output=true
          - -o
          - engine.kind=modern_ebpf
          - -o
          - stdout_output.enabled=true
        env:
        - name: FALCO_K8S_API
          value: "https://kubernetes.default.svc"
        - name: FALCO_K8S_API_CERT
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: FALCO_K8S_API_TOKEN
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: falco-config
          mountPath: /etc/falco/falco.yaml
          subPath: falco.yaml
        - name: falco-rules-local
          mountPath: /etc/falco/falco_rules.local.yaml
          subPath: falco_rules.local.yaml
        - name: k3s-containerd-sock
          mountPath: /run/k3s/containerd/containerd.sock
          readOnly: true
        - name: k3s-run
          mountPath: /run/k3s
          readOnly: true
        - name: proc-fs
          mountPath: /host/proc
          readOnly: true
        - name: boot-fs
          mountPath: /host/boot
          readOnly: true
        - name: lib-modules
          mountPath: /host/lib/modules
          readOnly: true
        - name: usr-fs
          mountPath: /host/usr
          readOnly: true
        - name: etc-fs
          mountPath: /host/etc
          readOnly: true
        - name: sys-fs
          mountPath: /sys/kernel/debug
        - name: btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: dev-fs
          mountPath: /host/dev
          readOnly: true
      volumes:
      - name: falco-config
        configMap:
          name: falco-config
      - name: falco-rules-local
        configMap:
          name: falco-rules-local
      # Mount whole /run/k3s — Socket type check fails on some K3s hosts
      - name: k3s-containerd-sock
        hostPath:
          path: /run/k3s/containerd/containerd.sock
      - name: k3s-run
        hostPath:
          path: /run/k3s
      - name: proc-fs
        hostPath:
          path: /proc
      - name: boot-fs
        hostPath:
          path: /boot
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: usr-fs
        hostPath:
          path: /usr
      - name: etc-fs
        hostPath:
          path: /etc
      - name: sys-fs
        hostPath:
          path: /sys/kernel/debug
      - name: btf
        hostPath:
          path: /sys/kernel/btf
      - name: dev-fs
        hostPath:
          path: /dev
      tolerations:
      - effect: NoSchedule
        operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: falco
  namespace: monitoring
  labels:
    app: falco
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: metrics
    port: 8765
    targetPort: 8765
  selector:
    app: falco
