apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  aegis-cpu.yml: |
    groups:
      - name: aegis-cpu
        rules:
          # Sustained high CPU on Boutique or chaos workloads (~80% of pod CPU
          # limit for ~2m). Uses cAdvisor — many Boutique ports are gRPC and do
          # not speak HTTP /metrics.
          - alert: AegisHighPodCPU
            expr: |
              (
                sum by (namespace, pod) (
                  rate(container_cpu_usage_seconds_total{
                    container!="",
                    container!="POD",
                    namespace=~"online-boutique|aegis-chaos"
                  }[1m])
                )
                /
                sum by (namespace, pod) (
                  container_spec_cpu_quota{
                    container!="",
                    container!="POD",
                    namespace=~"online-boutique|aegis-chaos"
                  }
                  /
                  container_spec_cpu_period{
                    container!="",
                    container!="POD",
                    namespace=~"online-boutique|aegis-chaos"
                  }
                )
              ) > 0.70
            for: 1m
            labels:
              severity: warning
              aegis_path: bug
            annotations:
              summary: "High CPU on {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod CPU > ~70–80% of its limit for ~1–2 minutes (ratio={{ $value | humanizePercentage }})."
  aegis-health.yml: |
    groups:
      - name: aegis-health
        rules:
          # A container was OOM-killed in the last 5 minutes. Fires immediately: the pod restarts so
          # fast that a "memory high for N minutes" rule would never see it.
          - alert: AegisContainerOOMKilled
            expr: |
              sum by (namespace, pod) (
                increase(container_oom_events_total{
                  container!="",
                  container!="POD",
                  namespace=~"online-boutique|aegis-chaos"
                }[5m])
              ) > 0
            for: 0m
            labels:
              severity: warning
              aegis_path: bug
            annotations:
              summary: "OOMKilled container in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "A container in this pod was killed for exceeding its memory limit."
          # 3+ container (re)starts in 10 minutes = crash loop. The per-workload restart budget in the
          # guardrails then limits how often Aegis itself restarts it before escalating to a human.
          - alert: AegisPodCrashLooping
            expr: |
              sum by (namespace, pod) (
                changes(container_start_time_seconds{
                  container!="",
                  container!="POD",
                  namespace=~"online-boutique|aegis-chaos"
                }[10m])
              ) >= 3
            for: 1m
            labels:
              severity: warning
              aegis_path: bug
            annotations:
              summary: "Crash loop on {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Containers restarted 3 or more times in 10 minutes."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager.monitoring.svc:9093']

      # Primary resource metrics for Boutique + chaos (CPU/memory/OOM signals).
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Optional app /metrics when a pod opts in with working HTTP metrics.
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=6h"
          - "--web.enable-lifecycle"
        ports:
        - name: web
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: rules-volume
          mountPath: /etc/prometheus/rules
        - name: storage-volume
          mountPath: /prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: rules-volume
        configMap:
          name: prometheus-rules
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 9090
    targetPort: 9090
  selector:
    app: prometheus
