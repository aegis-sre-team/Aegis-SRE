# Shell spawn injector (MITRE T1059 bait for Falco in Phase 2)
# Restricted: no secret mounts, non-root where possible, aegis-chaos only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-shell-sa
  namespace: aegis-chaos
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-shell-injection
  namespace: aegis-chaos
  labels:
    app: chaos-shell-injection
    aegis.io/chaos: shell
    aegis.io/mitre: T1059
spec:
  replicas: 0
  selector:
    matchLabels:
      app: chaos-shell-injection
  template:
    metadata:
      labels:
        app: chaos-shell-injection
        aegis.io/chaos: shell
        aegis.io/mitre: T1059
    spec:
      serviceAccountName: chaos-shell-sa
      automountServiceAccountToken: false
      containers:
        - name: shell-bait
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "chaos-shell-injection: spawning interactive-style shell loop (T1059 bait)"
              while true; do
                /bin/sh -c "id; uname -a; sleep 30"
                sleep 5
              done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
