# Credential file reader (MITRE T1552 bait for Falco).
# Detector: Falco rule "Aegis Sensitive File Read" (opens /etc/shadow). Expected outcome: quarantine.
# Restricted: no secret mounts, no service account token, read-only root, aegis-chaos only.
# Starts at 0 replicas; start and stop it from the console (or: kubectl scale ... --replicas=1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-credential-sa
  namespace: aegis-chaos
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-credential-read
  namespace: aegis-chaos
  labels:
    app: chaos-credential-read
    aegis.io/chaos: credential
    aegis.io/mitre: T1552
spec:
  replicas: 0
  selector:
    matchLabels:
      app: chaos-credential-read
  template:
    metadata:
      labels:
        app: chaos-credential-read
        aegis.io/chaos: credential
        aegis.io/mitre: T1552
    spec:
      serviceAccountName: chaos-credential-sa
      automountServiceAccountToken: false
      containers:
        - name: credential-bait
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "chaos-credential-read: reading /etc/shadow in a loop (T1552 bait)"
              while true; do
                cat /etc/shadow > /dev/null
                sleep 20
              done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
