# Memory pressure / OOM injector — scale to 1 to trigger
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-oom
  namespace: aegis-chaos
  labels:
    app: chaos-oom
    aegis.io/chaos: oom
spec:
  replicas: 0
  selector:
    matchLabels:
      app: chaos-oom
  template:
    metadata:
      labels:
        app: chaos-oom
        aegis.io/chaos: oom
    spec:
      containers:
        - name: stress
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "180M", "--vm-hang", "0", "--timeout", "600s"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
