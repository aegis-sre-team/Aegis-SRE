# Aegis Custom Falco Security Rules (MITRE ATT&CK Mapped)

- rule: Aegis Shell Spawned in Container
  desc: Detect when an interactive shell (sh, bash) is executed inside a container
  condition: >
    spawned_process and container and
    proc.name in (bash, sh, zsh, dash, ash, ksh, csh) and
    not proc.cmdline contains "docker-entrypoint"
  output: >
    [SECURITY_ALERT] Falco eBPF: Notice Shell spawned in container (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name cmd=%proc.cmdline pid=%proc.pid) MITRE:T1059
  priority: WARNING
  tags: [mitre_execution, T1059, aegis_security]

- rule: Aegis Sensitive File Read
  desc: Detect attempts to open or read sensitive Linux system files (/etc/shadow, /etc/sudoers; /etc/passwd is read by ordinary programs and is NOT a signal)
  condition: >
    open_read and container and
    (fd.name startswith "/etc/shadow" or fd.name startswith "/etc/sudoers")
  output: >
    [SECURITY_ALERT] Falco eBPF: Warning Sensitive file read (file=%fd.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name user=%user.name cmd=%proc.cmdline) MITRE:T1552
  priority: ERROR
  tags: [mitre_credential_access, T1552, aegis_security]

- rule: Aegis Network Discovery Tool Spawned
  desc: Detect execution of network scanning or exfiltration tools (curl, nmap, netcat, socat)
  condition: >
    spawned_process and container and
    proc.name in (nc, nmap, netcat, socat)
  output: >
    [SECURITY_ALERT] Falco eBPF: Notice Network discovery tool spawned (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name cmd=%proc.cmdline) MITRE:T1046
  priority: NOTICE
  tags: [mitre_discovery, T1046, aegis_security]
